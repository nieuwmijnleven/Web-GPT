# Final HTTPS OAuth reverse proxy. The configured public OAuth domain is supplied by
# OAUTH_PUBLIC_BASE_URL; this server is intentionally host-agnostic so the repository
# contains no deployment-specific hostname.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/devspace-oauth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devspace-oauth/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /mcp {
        return 404;
    }

    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration)(/.*)?$ {
        proxy_pass http://127.0.0.1:9292;
        proxy_set_header Host 127.0.0.1:9292;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(token|register|revoke)(/.*)?$ {
        access_log off;
        proxy_pass http://127.0.0.1:9292;
        proxy_set_header Host 127.0.0.1:9292;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:9292;
        proxy_set_header Host 127.0.0.1:9292;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
