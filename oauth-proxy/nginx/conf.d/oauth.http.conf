# Bootstrap-only HTTP configuration used before the TLS certificate exists.

server {
    # ACME HTTP-01 validation always starts on public port 80.
    listen 80;
    listen 2400;
    server_name devspace-oauth-bootstrap.invalid;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:2096$request_uri;
    }
}
