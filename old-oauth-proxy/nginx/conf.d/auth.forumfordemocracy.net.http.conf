# 최초 부트스트랩용 HTTP-only 설정 — auth.forumfordemocracy.net
# (certbot 인증서 발급 후 최종 HTTPS 설정으로 교체됨, bootstrap.sh가 자동 처리)

server {
    listen 80;
    server_name auth.forumfordemocracy.net;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
